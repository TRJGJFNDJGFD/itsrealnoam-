services:
  - type: web
    name: legendil-status-api
    runtime: node
    rootDir: legendil-status-api
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: STATUS_API_TOKEN
        sync: false
      - key: WEBSITE_ORIGIN
        sync: false
      - key: STALE_AFTER_MS
        value: "15000"
