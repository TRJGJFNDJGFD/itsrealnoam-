[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# SPA fallback for client-side routing (/status, etc). Function routes
# declared via `export const config = { path: "..." }` in netlify/functions
# are matched before this catch-all, so /api/v1/* still reaches the
# functions rather than falling through to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
